name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher

      - name: Validate server.json
        run: mcp-publisher validate server.json

      # The registry rejects duplicate versions. Skip the publish when this
      # exact version is already live, so re-running the workflow is safe.
      - name: Check whether this version is already published
        id: exists
        run: |
          NAME=$(jq -r .name server.json)
          VER=$(jq -r .version server.json)
          ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$NAME")
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.modelcontextprotocol.io/v0/servers/${ENC}/versions/${VER}")
          if [ "$CODE" = "200" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VER is already published."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with GitHub OIDC
        if: steps.exists.outputs.found != 'true'
        run: mcp-publisher login github-oidc

      - name: Publish
        if: steps.exists.outputs.found != 'true'
        run: mcp-publisher publish
